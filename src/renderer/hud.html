<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:">
  <title>CompanionAI · comandi</title>
  <link rel="stylesheet" href="ui.css">
  <style>
    /* L'HUD attorno al companion (Blocco 9b): una finestra trasparente che
       lascia passare i clic tranne sui comandi (hud.js). Il main la mette
       attorno al companion sotto il mouse e dice dov'e' lui (--av-*). */
    html, body { width: 100%; height: 100%; background: transparent; overflow: hidden; user-select: none; font-family: var(--font); color: var(--text); }
    #hud { position: absolute; inset: 0; opacity: 0; transition: opacity 0.18s var(--ease); }
    body.shown #hud { opacity: 1; }
    .capsule, .pill { position: absolute; }
    /* Le capsule ai lati del companion, all'altezza del busto; la pillola sotto (o sopra). */
    #cap-left  { top: calc(var(--av-y) + var(--av-h) * 0.18); left: max(4px, calc(var(--av-x) - 58px)); }
    #cap-right { top: calc(var(--av-y) + var(--av-h) * 0.18); left: min(calc(100% - 54px), calc(var(--av-x) + var(--av-w) + 8px)); }
    #pill { left: 50%; transform: translateX(-50%); }
    body.pill-below #pill { top: calc(var(--av-y) + var(--av-h) + 4px); }
    body.pill-above #pill { top: 0; }
    #name { position: absolute; left: 50%; transform: translateX(-50%); font-size: 11px; font-weight: 600; letter-spacing: 0.01em;
      padding: 2px 9px; border-radius: 999px; white-space: nowrap; color: var(--text-2); }
    body.pill-below #name { top: calc(var(--av-y) + var(--av-h) - 22px); }
    body.pill-above #name { top: calc(var(--av-y) + 6px); }
    .ring { --ring-color: var(--accent); }
    #r-energy { --ring-color: #d9c27a; }
    #r-bond { --ring-color: #d98a7a; }
    .icon-round.listening { background: #6fbf86; color: #10241a; }
    .sep { width: 1px; height: 20px; background: var(--line); margin: 0 2px; }
    @media (prefers-reduced-motion: reduce) { #hud { transition: none; } }
  </style>
</head>
<body class="pill-below">
<div id="hud">
  <div id="cap-left" class="capsule glass" aria-label="Come sta">
    <div class="ring" id="r-mood" title="Umore">
      <svg class="track" viewBox="0 0 36 36"><circle cx="18" cy="18" r="15"/><circle class="value" cx="18" cy="18" r="15"/></svg>
      <svg class="i" viewBox="0 0 24 24"><path d="M12 19s-6.5-4.2-6.5-9A3.6 3.6 0 0 1 12 7.6 3.6 3.6 0 0 1 18.5 10c0 4.8-6.5 9-6.5 9z"/></svg>
    </div>
    <div class="ring" id="r-energy" title="Energia">
      <svg class="track" viewBox="0 0 36 36"><circle cx="18" cy="18" r="15"/><circle class="value" cx="18" cy="18" r="15"/></svg>
      <svg class="i" viewBox="0 0 24 24"><path d="M13 3.5 6.5 13H12l-1 7.5L17.5 11H12z"/></svg>
    </div>
    <div class="ring" id="r-bond" title="Rapporto">
      <svg class="track" viewBox="0 0 36 36"><circle cx="18" cy="18" r="15"/><circle class="value" cx="18" cy="18" r="15"/></svg>
      <svg class="i" viewBox="0 0 24 24"><circle cx="9" cy="9" r="3"/><circle cx="15.5" cy="10.5" r="2.5"/><path d="M4 18c.6-2.6 2.6-4.3 5-4.3s4.4 1.7 5 4.3M13.6 14.2c2.6-.4 4.8 1.2 5.4 3.8"/></svg>
    </div>
  </div>

  <div id="cap-right" class="capsule glass" aria-label="Azioni">
    <button class="icon-round" data-cmd="chat" id="b-single" title="Chat con lui"><svg class="i" viewBox="0 0 24 24"><path d="M5 6.5h14v9H10l-4 3.5v-3.5H5z"/></svg><span class="badge" data-unread hidden></span></button>
    <button class="icon-round" data-cmd="room" title="Apri la stanza"><svg class="i" viewBox="0 0 24 24"><path d="M4 11 12 4.5 20 11M6.5 9v10h11V9"/><path d="M10 19v-5h4v5"/></svg></button>
    <button class="icon-round" data-cmd="avatar" title="Cambia avatar"><svg class="i" viewBox="0 0 24 24"><path d="M7 7h10M7 7l2.5-2.5M7 7l2.5 2.5M17 17H7M17 17l-2.5-2.5M17 17l-2.5 2.5"/></svg></button>
    <button class="icon-round" data-cmd="hide" title="Nascondi (torna dall'icona nella barra)"><svg class="i" viewBox="0 0 24 24"><path d="M3.5 12s3-5.5 8.5-5.5 8.5 5.5 8.5 5.5-3 5.5-8.5 5.5S3.5 12 3.5 12z"/><path d="M4.5 19.5 19.5 4.5"/></svg></button>
  </div>

  <div id="name" class="glass"></div>

  <div id="pill" class="pill glass" aria-label="Comandi">
    <button class="icon-round" data-cmd="mic" id="b-mic" title="Parla con il microfono"><svg class="i" viewBox="0 0 24 24"><rect x="9" y="3.5" width="6" height="10" rx="3"/><path d="M6 11a6 6 0 0 0 12 0M12 17v3.5"/></svg></button>
    <button class="icon-round" data-cmd="pause" id="b-pause" title="Pausa: zitto e fermo"><svg class="i" viewBox="0 0 24 24"><path d="M9 6v12M15 6v12"/></svg></button>
    <button class="icon-round" data-cmd="group-chat" id="b-group" title="Chat di gruppo, con tutti quelli sul desktop" hidden><svg class="i" viewBox="0 0 24 24"><path d="M3.5 6h11v7.5H8L5 16v-2.5H3.5z"/><path d="M17 9.5h3.5v7H19V19l-2.8-2.5H11v-1.5"/></svg><span class="badge" data-unread hidden></span></button>
    <button class="icon-round" data-cmd="people" title="Chi e' sul desktop"><svg class="i" viewBox="0 0 24 24"><circle cx="9" cy="9" r="3"/><path d="M3.5 18.5c.6-3 2.8-5 5.5-5s4.9 2 5.5 5M15 6.2a3 3 0 0 1 0 5.6M17 13.8c1.8.7 3 2.4 3.4 4.7"/></svg></button>
    <span class="sep"></span>
    <button class="icon-round" data-cmd="settings" title="Impostazioni"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3.5v2.2M12 18.3v2.2M3.5 12h2.2M18.3 12h2.2M6 6l1.6 1.6M16.4 16.4 18 18M6 18l1.6-1.6M16.4 7.6 18 6"/></svg></button>
    <span class="grip" id="grip" title="Trascina"></span>
  </div>
</div>
<script src="hud.js"></script>
</body>
</html>
