<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <!-- Un oggetto della borsa sul desktop (Blocco 10c). Nessuno script inline
       tranne l'importmap, ammesso per hash (npm test lo ricalcola). vrm: e
       object: servono i modelli, blob: le texture estratte dai .glb. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'sha256-QY9o8cXENEIT04+6gC80St1QTC91sys2Pp7UKD51MzU='; style-src 'unsafe-inline'; img-src blob: data: vrm: object:; connect-src blob: data: vrm: object:">
  <title>Oggetto</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; background: transparent; overflow: hidden; user-select: none; }
    canvas { display: block; width: 100%; height: 100%; cursor: grab; opacity: 0; transition: opacity 0.2s ease;
      filter: drop-shadow(0 4px 5px rgba(30, 16, 4, 0.45)); }
    body.ready canvas { opacity: 1; }
    canvas:active { cursor: grabbing; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three.module.js",
        "three/addons/": "./vendor/three-addons/"
      }
    }
  </script>
</head>
<body>
<canvas id="view"></canvas>
<script type="module" src="object.js"></script>
</body>
</html>
