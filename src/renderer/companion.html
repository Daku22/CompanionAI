<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <!-- Nessuno script inline tranne l'importmap, ammesso per hash: se lo cambi,
       aggiorna l'hash (npm test lo ricalcola e dice quale mettere).
       vrm: e avatar: servono i modelli 3D, scene: le scene importate; blob: le
       texture estratte dai .glb. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'sha256-ZbtU6faAuNdPdmM0BcNga30v1JmQYiPkfUDkH4n65CY='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: vrm: avatar: scene:; connect-src 'self' data: blob: vrm: avatar: motion: scene:">
  <title>CompanionAI</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      background: transparent;
      overflow: hidden;
      user-select: none;
    }
    #app {
      width: 100%; height: 100%;
      position: relative;
    }
    #pixi-mount {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }
    #three-mount {
      position: absolute;
      inset: 0;
      pointer-events: none;
      display: none;
    }
    /* Speech bubble */
    #bubble {
      position: absolute;
      top: 6px;
      left: 50%;
      transform: translateX(-50%) translateY(-4px);
      background: rgba(255,255,255,0.96);
      border: 1.5px solid #7a9e82;
      border-radius: 14px;
      padding: 4px 12px;
      font-family: 'Segoe UI', system-ui, sans-serif;
      font-size: 11px;
      font-weight: 600;
      color: #2c4033;
      white-space: nowrap;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.22s ease, transform 0.22s ease;
      z-index: 50;
      box-shadow: 0 3px 10px rgba(0,0,0,0.15);
    }
    #bubble::after {
      content: '';
      position: absolute;
      bottom: -7px; left: 50%;
      transform: translateX(-50%);
      border: 4px solid transparent;
      border-top-color: #7a9e82;
    }
    #bubble.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
    /* Strato che riceve il mouse sopra l'avatar (companion-input.js). Il
       trascinamento lo fa il main: niente -webkit-app-region, che lasciava
       spostare la finestra a Windows senza velocita' e apriva il menu di
       sistema col tasto destro. */
    #drag-zone {
      position: absolute;
      inset: 0;
      z-index: 10;
      cursor: grab;
      touch-action: none;
    }
    #drag-zone:active { cursor: grabbing; }
    /* I pulsanti compaiono solo con il mouse sull'avatar o su di loro. */
    #click-zone, #switch-zone { opacity: 0; }
    body.hover-avatar #click-zone, body.hover-avatar #switch-zone, body.menu-open #switch-zone { opacity: 1; }
    /* Chat button (clickable, not draggable) */
    #click-zone {
      position: absolute;
      top: 8px;
      right: 8px;
      width: 24px;
      height: 24px;
      cursor: pointer;
      z-index: 20;
      border-radius: 50%;
      background: rgba(120, 160, 140, 0.35);
      border: 1.5px solid rgba(100, 140, 120, 0.5);
      transition: opacity 0.2s ease, background 0.15s;
    }
    #click-zone:hover {
      background: rgba(120, 160, 140, 0.6);
    }
    #switch-zone {
      position: absolute;
      top: 8px;
      left: 8px;
      width: 24px;
      height: 24px;
      cursor: pointer;
      z-index: 20;
      border-radius: 50%;
      background: rgba(120, 160, 140, 0.35);
      border: 1.5px solid rgba(100, 140, 120, 0.5);
      transition: opacity 0.2s ease, background 0.15s;
      display: flex; align-items: center; justify-content: center;
    }
    #switch-zone:hover {
      background: rgba(120, 160, 140, 0.6);
    }
    /* Switch button icon */
    #switch-zone::after {
      content: '🔄';
      font-size: 13px;
    }
    /* Chat button icon */
    #click-zone::after {
      content: '💬';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 13px;
      line-height: 1;
    }
    /* Voci del menu avatar, generate da companion-3d.js */
    .menu-item { padding: 5px; cursor: pointer; white-space: nowrap; }
    .menu-item:hover { background: rgba(180, 140, 255, 0.15); border-radius: 6px; }
    .menu-item.active { color: #d9c4ff; }
    .menu-item .kind { opacity: 0.5; margin-left: 6px; }
    /* La finestra e' piccola: con molti avatar l'elenco scorre invece di uscire. */
    #avatar-list { max-height: calc(100vh - 110px); overflow-y: auto; }
    .menu-item.menu-note { opacity: 0.6; }
    .menu-item.check { display: flex; align-items: center; gap: 5px; }
    .menu-item.check input { margin: 0; accent-color: #b48cff; cursor: pointer; }
    .menu-item.danger { color: #ff9a9a; }
    .menu-item.disabled { opacity: 0.4; pointer-events: none; }

    /* ── Stanza (room-ui.js): barra del titolo e bordi ─────────────────── */
    #room-bar, .room-grip { display: none; }
    body.mode-room #room-bar {
      display: flex; align-items: center; gap: 6px;
      position: absolute; top: 0; left: 0; right: 0; height: 36px;
      padding: 0 6px 0 12px; z-index: 40;
      background: rgba(14, 11, 22, 0.82);
      border-bottom: 1px solid rgba(180,140,255,0.18);
      font-family: 'Segoe UI', system-ui, sans-serif; font-size: 12px; color: #e8ddff;
      -webkit-app-region: drag;
    }
    body.mode-room .room-grip { display: block; position: absolute; z-index: 45; }
    body.room-maximized .room-grip { display: none; }
    #room-bar .room-title { font-weight: 600; letter-spacing: 0.3px; margin-right: auto; opacity: 0.9; }
    #room-bar select, #room-bar button { -webkit-app-region: no-drag; font: inherit; color: inherit; }
    #room-bar select {
      background: rgba(255,255,255,0.06); border: 1px solid rgba(180,140,255,0.25);
      border-radius: 6px; padding: 3px 6px; margin-right: 6px; cursor: pointer;
    }
    #room-bar select option { background: #1b1528; }
    #room-bar button {
      width: 32px; height: 26px; border: 0; border-radius: 6px; background: transparent; cursor: pointer; font-size: 14px;
    }
    #room-bar button:hover { background: rgba(180,140,255,0.18); }
    #room-bar #room-close:hover { background: rgba(232,72,85,0.85); color: white; }
    #room-bar #room-adjust { display: none; }
    #room-bar #room-adjust.shown { display: block; }

    /* ── Sistema la scena (scene-adjust.js), per le scene importate ────── */
    #scene-adjust {
      display: none; position: absolute; top: 46px; left: 10px; z-index: 42; width: 250px;
      padding: 10px 12px; border-radius: 10px;
      background: rgba(14, 11, 22, 0.9); border: 1px solid rgba(180,140,255,0.22);
      font-family: 'Segoe UI', system-ui, sans-serif; font-size: 12px; color: #e8ddff;
    }
    body.mode-room #scene-adjust.open { display: block; }
    #scene-adjust .title { font-weight: 600; margin-bottom: 8px; }
    #scene-adjust .title span { font-weight: 400; opacity: 0.7; }
    #scene-adjust label { display: grid; grid-template-columns: 70px 1fr 52px; align-items: center; gap: 6px; margin: 4px 0; }
    #scene-adjust input[type=range] { width: 100%; accent-color: #b48cff; }
    #scene-adjust output { text-align: right; opacity: 0.85; font-variant-numeric: tabular-nums; }
    #scene-adjust .row { display: flex; gap: 6px; margin-top: 8px; }
    #scene-adjust button {
      flex: 1; padding: 5px 6px; border-radius: 6px; cursor: pointer; font: inherit; color: inherit;
      background: rgba(255,255,255,0.06); border: 1px solid rgba(180,140,255,0.25);
    }
    #scene-adjust button:hover { background: rgba(180,140,255,0.18); }
    #scene-adjust button.active { background: rgba(180,140,255,0.35); }
    #scene-adjust button.danger { color: #ff9a9a; }
    #scene-adjust .hint { margin-top: 6px; opacity: 0.75; min-height: 1em; }
    body.scene-placing #drag-zone, body.scene-placing #drag-zone:active { cursor: crosshair; }
    /* Bordi per ridimensionare: 6 px sui lati, 12 agli angoli. */
    .room-grip[data-edge="n"]  { top: 0; left: 12px; right: 12px; height: 6px; cursor: ns-resize; }
    .room-grip[data-edge="s"]  { bottom: 0; left: 12px; right: 12px; height: 6px; cursor: ns-resize; }
    .room-grip[data-edge="e"]  { right: 0; top: 12px; bottom: 12px; width: 6px; cursor: ew-resize; }
    .room-grip[data-edge="w"]  { left: 0; top: 12px; bottom: 12px; width: 6px; cursor: ew-resize; }
    .room-grip[data-edge="ne"] { top: 0; right: 0; width: 12px; height: 12px; cursor: nesw-resize; }
    .room-grip[data-edge="sw"] { bottom: 0; left: 0; width: 12px; height: 12px; cursor: nesw-resize; }
    .room-grip[data-edge="nw"] { top: 0; left: 0; width: 12px; height: 12px; cursor: nwse-resize; }
    .room-grip[data-edge="se"] { bottom: 0; right: 0; width: 12px; height: 12px; cursor: nwse-resize; }
    /* Nella stanza: la scena riempie la finestra, l'avatar 2D ci sta sopra,
       i pulsanti del desktop non servono e il fumetto scende sotto la barra. */
    body.mode-room #app { background: #1d1b22; }
    body.mode-room #pixi-mount { z-index: 2; }
    body.mode-room #three-mount { z-index: 1; }
    body.mode-room #click-zone, body.mode-room #switch-zone, body.mode-room #model-menu { display: none !important; }
    body.mode-room #bubble { top: 48px; }
    body.mode-room #drag-zone { cursor: default; }
    body.mode-room #drag-zone:active { cursor: grabbing; }

  </style>
  <!-- Librerie copiate sotto src/ da scripts/vendor.js: dentro l'app
       impacchettata i percorsi di node_modules non sono garantiti. -->
  <script src="vendor/pixi.min.js"></script>
  <script src="vendor/pixi-unsafe-eval.min.js"></script>
  <script src="assets/strips/sprites.js"></script>
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three.module.js",
        "three/addons/": "./vendor/three-addons/",
        "@pixiv/three-vrm": "./vendor/three-vrm.module.js",
        "@pixiv/three-vrm-animation": "./vendor/three-vrm-animation.module.js"
      }
    }
  </script>
</head>
<body>
<div id="app">
  <div id="bubble"></div>
  <div id="pixi-mount"></div>
  <div id="three-mount"></div>
  <div id="drag-zone"></div>
  <div id="click-zone"></div>
  <div id="switch-zone"></div>
  <div id="room-bar">
    <span class="room-title">CompanionAI · Stanza</span>
    <select id="room-scene" title="Scena"></select>
    <button id="room-adjust" title="Sistema la scena">⚙</button>
    <button id="room-chat" title="Chat">💬</button>
    <button id="room-min" title="Riduci a icona">–</button>
    <button id="room-max" title="Ingrandisci">□</button>
    <button id="room-close" title="Torna sul desktop">✕</button>
  </div>
  <div id="scene-adjust">
    <div class="title">Sistema la scena <span id="adj-name"></span></div>
    <label>Grandezza <input type="range" id="adj-scale" min="-3" max="3" step="0.01" value="0"><output id="adj-scale-out"></output></label>
    <label>Rotazione <input type="range" id="adj-rot" min="0" max="359" step="1" value="0"><output id="adj-rot-out"></output></label>
    <label>Pavimento <input type="range" id="adj-lift" min="-100" max="100" step="1" value="0"><output id="adj-lift-out"></output></label>
    <div class="row"><button id="adj-place">📍 Metti l'avatar qui</button><button id="adj-auto">Stima di nuovo</button></div>
    <div class="row"><button id="adj-remove" class="danger">Elimina scena</button><button id="adj-done">Fatto</button></div>
    <div class="hint" id="adj-hint"></div>
  </div>
  <div class="room-grip" data-edge="n"></div><div class="room-grip" data-edge="s"></div>
  <div class="room-grip" data-edge="e"></div><div class="room-grip" data-edge="w"></div>
  <div class="room-grip" data-edge="ne"></div><div class="room-grip" data-edge="nw"></div>
  <div class="room-grip" data-edge="se"></div><div class="room-grip" data-edge="sw"></div>
  <div id="model-menu" style="display: none; position: absolute; top: 35px; left: 8px; background: rgba(14, 11, 22, 0.94); border: 1px solid rgba(180,140,255,0.2); border-radius: 10px; padding: 5px; z-index: 30; font-family: 'Segoe UI', system-ui, sans-serif; font-size: 11px; color: white; ">
    <div id="avatar-list"></div>
    <div id="btn-import-avatar" class="menu-item" style="color: #d9c4ff;">+ Importa avatar…</div>
    <div id="btn-manage-avatars" class="menu-item" style="color: #d9c4ff; display: none;">− Elimina importati…</div>
  </div>
</div>

<script src="sway.js"></script>
<script src="companion-input.js"></script>
<script src="companion-2d.js"></script>

<script type="module" src="companion-3d.js"></script>
</body>
</html>
